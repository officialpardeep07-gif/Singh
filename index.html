<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#14213d;--acc:#fca311;--bg:#d5d9e0}
*{box-sizing:border-box}
body{margin:0;font:14px/1.3 system-ui,Arial,sans-serif;background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column}
#bar{background:var(--ink);color:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar .sep{width:1px;height:24px;background:#ffffff40;margin:0 2px}
button,label.b{font:inherit;background:#27375e;color:#fff;border:1px solid #ffffff30;border-radius:6px;padding:7px 10px;cursor:pointer;display:inline-block}
button:hover,label.b:hover{background:#34487c}
button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
#dq{font:inherit;padding:7px;border-radius:6px}
button:disabled,input:disabled{opacity:.4;cursor:default}
button.go{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
#bar input[type=number]{width:58px;padding:6px;border-radius:6px;border:1px solid #ffffff30;background:#fff;color:#000}
#bar input[type=color]{width:34px;height:32px;padding:0;border:0;background:none}
#bar small{opacity:.75}
#tabs{display:none;gap:4px;flex-wrap:wrap;background:#0d1730;padding:5px 8px;align-items:center}
#tabs button{padding:5px 9px}#tabs button.x{padding:5px 7px;opacity:.8}
html,body{overscroll-behavior:none}
#stage{flex:1;overflow:auto;padding:12px;overscroll-behavior:contain}
.empty{max-width:420px;margin:12vh auto;text-align:center;color:#3b4252;font-size:16px}
.page{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 2px 12px #0003}
.page canvas{width:100%;height:100%;display:block}
.layer{position:absolute;inset:0}
.tx{position:absolute;color:transparent;caret-color:#000;white-space:pre;line-height:1.2;font-family:Arial,Helvetica,sans-serif;outline:none;cursor:text;padding:0 1px}
.tx:hover{outline:1px solid #14213d30}
.tx:focus{outline:1px solid #1a73e8}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0}
#cb{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--ink);color:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 4px 16px #0006;z-index:20;max-width:96vw}
#cb button.ok{background:#d62828;border-color:#d62828;font-weight:600}
.cs{position:absolute;background:#ff000026;border:2px solid #d00;cursor:move;touch-action:none;z-index:5}
.cs i{position:absolute;width:var(--hs,22px);height:var(--hs,22px);background:#fff;border:2px solid #d00;touch-action:none}
.cs i[data-s=tl]{left:calc(var(--hs)/-2 - 2px);top:calc(var(--hs)/-2 - 2px);cursor:nwse-resize}.cs i[data-s=tr]{right:calc(var(--hs)/-2 - 2px);top:calc(var(--hs)/-2 - 2px);cursor:nesw-resize}
.cs i[data-s=bl]{left:calc(var(--hs)/-2 - 2px);bottom:calc(var(--hs)/-2 - 2px);cursor:nesw-resize}.cs i[data-s=br]{right:calc(var(--hs)/-2 - 2px);bottom:calc(var(--hs)/-2 - 2px);cursor:nwse-resize}
.cs i[data-s=l]{left:calc(var(--hs)/-2 - 2px);top:calc(50% - var(--hs)/2);cursor:ew-resize}.cs i[data-s=r]{right:calc(var(--hs)/-2 - 2px);top:calc(50% - var(--hs)/2);cursor:ew-resize}
.cs i[data-s=t]{top:calc(var(--hs)/-2 - 2px);left:calc(50% - var(--hs)/2);cursor:ns-resize}.cs i[data-s=b]{bottom:calc(var(--hs)/-2 - 2px);left:calc(50% - var(--hs)/2);cursor:ns-resize}
.rb{position:absolute;background:#ff000022;border:1px dashed #d00;pointer-events:none}
.tx.ed{background:#fff;color:#000}
.tool-text .tx,.tool-box .tx,.tool-cut .tx,.tool-line .tx,.tool-area .tx{pointer-events:none}
.tool-text .layer,.tool-box .layer,.tool-cut .layer,.tool-line .layer,.tool-area .layer{cursor:crosshair}
.tool-line .el,.tool-area .el,.tool-cut .el{pointer-events:none}
.tool-line .layer,.tool-area .layer,.tool-cut .layer{touch-action:none}
.el.line::after{content:"";position:absolute;inset:-7px}
.el{position:absolute}
.el.box:not(.line):not(.frame){z-index:1}
.el.line,.el.frame,.el.text{z-index:3}
.el.img{z-index:4}
.page{position:relative}
.page:has(.el.sel){z-index:6}
.tx{z-index:2}
.el.frame{pointer-events:none;box-sizing:border-box;background:transparent!important}
.el.frame .fe,.el.frame .rz{pointer-events:auto}
.fe{position:absolute;cursor:move}
.fe.t{left:0;right:0;top:-6px;height:12px}.fe.b{left:0;right:0;bottom:-6px;height:12px}.fe.l{top:0;bottom:0;left:-6px;width:12px}.fe.r{top:0;bottom:0;right:-6px;width:12px}
.tool-frame .tx,.tool-frame .el,.tool-line .el *,.tool-area .el *,.tool-cut .el *,.tool-frame .el *{pointer-events:none}
.tool-frame .layer{cursor:crosshair;touch-action:none}
.el.sel{outline:2px solid var(--acc)}
.el.img,.el.box{touch-action:none;cursor:move}
.el img{position:absolute;max-width:none;display:block;pointer-events:none;user-select:none}
.win{position:absolute;inset:0;overflow:hidden}
.ghost{display:none;opacity:.35}
.el.crop .ghost{display:block}
.el.crop{outline:2px dashed var(--acc);cursor:grab}
.ch{position:absolute;display:none;width:18px;height:18px;background:#fff;border:2px solid var(--ink);touch-action:none;z-index:2}
.el.crop .ch{display:block}
.el.crop .rz{display:none}
.ch[data-s=tl]{left:-9px;top:-9px;cursor:nwse-resize}.ch[data-s=tr]{right:-9px;top:-9px;cursor:nesw-resize}
.ch[data-s=bl]{left:-9px;bottom:-9px;cursor:nesw-resize}.ch[data-s=br]{right:-9px;bottom:-9px;cursor:nwse-resize}
.ch[data-s=l]{left:-9px;top:calc(50% - 9px);cursor:ew-resize}.ch[data-s=r]{right:-9px;top:calc(50% - 9px);cursor:ew-resize}
.ch[data-s=t]{top:-9px;left:calc(50% - 9px);cursor:ns-resize}.ch[data-s=b]{bottom:-9px;left:calc(50% - 9px);cursor:ns-resize}
.ct{padding:2px 4px;line-height:1.2;white-space:pre;min-width:24px;outline:none;font-family:Arial,Helvetica,sans-serif}
.mv,.rz{position:absolute;display:none;touch-action:none;font-style:normal}
.el.sel .mv,.el.sel .rz{display:block}
.mv{left:0;top:-24px;width:24px;height:24px;background:var(--acc);color:var(--ink);text-align:center;line-height:24px;cursor:move;border-radius:4px}
.rz{right:-8px;bottom:-8px;width:16px;height:16px;background:var(--acc);border:2px solid var(--ink);border-radius:50%;cursor:nwse-resize}
</style>
</head>
<body>
<div id="bar">
  <label class="b">Open PDF<input id="pf" type="file" accept="application/pdf" hidden></label>
  <label class="b" title="Open another PDF in a new tab to copy / crop from it">+ Another PDF<input id="pr" type="file" accept="application/pdf" multiple hidden></label>
  <button id="pa" title="Paste the last copied area into the Main PDF">Paste</button>
  <button id="un" disabled>&#8630; Undo</button>
  <button id="bl">Add blank page</button>
  <button id="dp">Delete page</button>
  <span class="sep"></span>
  <button id="t-select" class="on">Select</button>
  <button id="t-text">Add text</button>
  <button id="t-box">White box</button>
  <button id="t-cut" title="Drag over a table row or column to remove it and close the gap">Delete row/col</button>
  <button id="t-line" title="Drag to draw a straight line">Line</button><button id="t-frame" title="Drag to draw a bordered box (no fill)">Border box</button><small>Thick</small><input id="lt" type="number" min="0.5" step="0.5" value="1.5">
  <button id="pb">Page border</button>
  <button id="t-area" title="Select written area, then copy / move it anywhere">Copy area</button>
  <button id="t-img">Add photo</button>
  <input id="imf" type="file" accept="image/*" hidden>
  <span class="sep"></span>
  <small>Size</small><input id="fs" type="number" min="4" max="200" disabled>
  <button id="bd" disabled><b>B</b></button>
  <input id="cl" type="color" value="#000000" disabled>
  <small>W</small><input id="w" type="number" min="1" step="0.5" disabled>
  <small>H</small><input id="h" type="number" min="1" step="0.5" disabled>
  <button id="del" disabled>Delete item</button>
  <button id="cr" disabled>Crop photo</button><button id="rc" disabled>Show full photo</button><button id="fp" disabled>Fit to page</button>
  <span class="sep"></span>
  <button id="zo">&minus;</button><button id="zl" title="Reset zoom">100%</button><button id="zi">+</button>
  <span class="sep"></span>
  <select id="dq" title="Preview sharpness"><option value="300">Preview 300 DPI</option><option value="600">Preview 600 DPI</option><option value="800">Preview 800 DPI</option></select>
  <button id="dz" title="ZIP with edited PDF + 300 DPI page images, ready for CorelDRAW">Download CDR ZIP</button>
  <button id="dl" class="go">Download PDF</button>
</div>
<div id="tabs"></div>
<div id="cb"><small id="ci">Row ya column select karo, handles se size set karo</small>
  <span id="cb-cut" style="display:contents"><button id="cd-row">Row</button><button id="cd-col">Column</button>
  <button id="c-ok" class="ok">&#10004; OK, delete</button></span>
  <span id="cb-area" style="display:none"><button id="c-copy" class="go">Copy</button><button id="c-move" class="ok">Cut (move)</button></span>
  <button id="c-no">&#10005; Cancel</button></div>
<div id="stage"><div id="pages"><p class="empty">Open a PDF (or drop it here) to start editing. Tap any text to change or delete it.</p></div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const S={tool:'select',sel:null,bytes:null};
const U=[];let Z=1,PID=0;
const IR={};let IK=0;const regImg=u=>(IR[++IK]=u,IK);
const hx=c=>{const m=c.match(/\d+/g);if(!m||c.indexOf('rgba(0, 0, 0, 0)')>-1)return'#000000';return'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('')};
const fitW=()=>Math.min($('stage').clientWidth-24,900);
const allPages=()=>[...document.querySelectorAll('.page')];
function curPage(){const sr=$('stage').getBoundingClientRect(),m=sr.top+sr.height/2,ps=allPages();return ps.find(p=>{const r=p.getBoundingClientRect();return r.top<=m&&r.bottom>=m})||ps[0]}

function setTool(t){S.tool=t;cancelCut();$('stage').className='tool-'+t;['select','text','box','cut','line','area','frame'].forEach(k=>$('t-'+k).classList.toggle('on',k===t))}
$('t-select').onclick=()=>setTool('select');
$('t-text').onclick=()=>setTool(S.tool==='text'?'select':'text');
$('t-box').onclick=()=>setTool(S.tool==='box'?'select':'box');
$('t-img').onclick=()=>$('imf').click();
$('t-cut').onclick=()=>setTool(S.tool==='cut'?'select':'cut');
$('t-line').onclick=()=>setTool(S.tool==='line'?'select':'line');
$('t-frame').onclick=()=>setTool(S.tool==='frame'?'select':'frame');
$('t-area').onclick=()=>setTool(S.tool==='area'?'select':'area');

function select(el){if(S.sel){S.sel.classList.remove('sel');if(S.sel!==el)S.sel.classList.remove('crop')}S.sel=el;if(el&&el.classList.contains('el'))el.classList.add('sel');sync()}
function sync(){
  const e=S.sel,t=e&&(e.dataset.t||'tx');
  $('fs').disabled=$('bd').disabled=!(t==='text'||t==='tx');
  $('cl').disabled=$('del').disabled=!t;
  $('w').disabled=$('h').disabled=!(t==='img'||t==='box');
  $('cr').disabled=$('rc').disabled=$('fp').disabled=t!=='img';
  $('cr').classList.toggle('on',!!(e&&e.classList.contains('crop')));
  if(!e)return;
  const cs=getComputedStyle(e);
  if(t==='text'||t==='tx'){$('fs').value=Math.round(parseFloat(cs.fontSize));$('cl').value=hx(cs.color)}
  if(t==='box')$('cl').value=hx(e.classList.contains('frame')?cs.borderTopColor:cs.backgroundColor);
  if(t==='box'){$('w').value=+parseFloat(e.style.width).toFixed(1);$('h').value=+parseFloat(e.style.height).toFixed(1)}else if(t==='img'){$('w').value=Math.round(e.offsetWidth);$('h').value=Math.round(e.offsetHeight)}
}
function sampleBg(e){
  try{
    const d=e.closest('.page'),c=d.querySelector('canvas');if(!c.width)return'#ffffff';
    const f=c.width/+d.dataset.bw,x=c.getContext('2d'),l=e.offsetLeft*f,t=e.offsetTop*f,w=e.offsetWidth*f,h=e.offsetHeight*f,g=4*f;
    const pts=[[l-g,t+h/2],[l+w+g,t+h/2],[l+w/2,t-g],[l+w/2,t+h+g],[l-g,t+g],[l+w+g,t+h-g],[l+g,t-g],[l+g,t+h+g]],R=[],G=[],B=[];
    pts.forEach(q=>{const px=Math.max(0,Math.min(c.width-1,q[0])),py=Math.max(0,Math.min(c.height-1,q[1])),v=x.getImageData(px,py,1,1).data;R.push(v[0]);G.push(v[1]);B.push(v[2])});
    const m=a=>a.sort((u,v)=>u-v)[a.length>>1];
    return'rgb('+m(R)+','+m(G)+','+m(B)+')';
  }catch(_){return'#ffffff'}
}
function ink(e,bg){
  try{const d=e.closest('.page'),c=d.querySelector('canvas');if(!c.width)return'#000000';
    const f=c.width/+d.dataset.bw,x=Math.max(0,e.offsetLeft*f),y=Math.max(0,e.offsetTop*f),w=Math.max(1,Math.min(c.width-x,e.offsetWidth*f)),h=Math.max(1,Math.min(c.height-y,e.offsetHeight*f));
    const D=c.getContext('2d').getImageData(x,y,w,h).data,b=bg.match(/\d+/g).map(Number);let best=0,r=0,g=0,bl=0;
    for(let i=0;i<D.length;i+=4){const q=Math.abs(D[i]-b[0])+Math.abs(D[i+1]-b[1])+Math.abs(D[i+2]-b[2]);if(q>best){best=q;r=D[i];g=D[i+1];bl=D[i+2]}}
    return best>120?'rgb('+r+','+g+','+bl+')':'#000000';
  }catch(_){return'#000000'}
}
function markEd(e){if(!e.classList.contains('ed')){const bg=sampleBg(e);e.style.background=bg;e.style.color=ink(e,bg);e.classList.add('ed')}}
const touch=e=>{if(e.classList.contains('tx'))markEd(e)};
$('fs').oninput=()=>{const e=S.sel;if(!e)return;e.style.fontSize=Math.max(4,+$('fs').value||12)+'px';touch(e)};
$('bd').onclick=()=>{const e=S.sel;if(!e)return;e.style.fontWeight=getComputedStyle(e).fontWeight>=600?'400':'700';touch(e)};
$('cl').oninput=()=>{const e=S.sel;if(!e)return;if(e.dataset.t==='box'){if(e.classList.contains('frame'))e.style.borderColor=$('cl').value;else e.style.background=$('cl').value}else{e.style.color=$('cl').value;touch(e)}};
$('w').oninput=()=>{const e=S.sel;if(!e)return;const w=+$('w').value;if(w<1)return;if(e.dataset.t==='img')return scaleImg(e,w/e.offsetWidth);e.style.width=w+'px';sync()};
$('h').oninput=()=>{const e=S.sel;if(!e||+$('h').value<1)return;if(e.dataset.t==='img')return scaleImg(e,+$('h').value/e.offsetHeight);e.style.height=$('h').value+'px'};
function delItem(){const e=S.sel;if(!e)return;snap();if(e.classList.contains('tx')){e.textContent='';markEd(e);e.blur()}else e.remove();select(null)}
$('del').onclick=delItem;
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();undo();return}if((ev.key==='Delete'||ev.key==='Backspace')&&S.sel&&S.sel.classList.contains('el')&&!document.activeElement.isContentEditable){ev.preventDefault();delItem()}});

function applyZ(d){d.style.width=d.dataset.bw*Z+'px';d.style.height=d.dataset.bh*Z+'px';d.firstChild.style.transform='scale('+Z+')'}
function makePage(w,h,pw,ph){
  const d=document.createElement('div');d.className='page';d.dataset.bw=w;d.dataset.bh=h;d.dataset.pw=pw;d.dataset.ph=ph;d.dataset.id=++PID;d._cuts=[];
  d.innerHTML='<div class="sheet"><canvas></canvas><div class="layer"></div></div>';
  const sh=d.firstChild,L=sh.lastChild;sh.style.width=w+'px';sh.style.height=h+'px';applyZ(d);
  L.addEventListener('pointerdown',e=>{
    const t=e.target;if(t!==L&&!t.classList.contains('tx'))return;
    const r=L.getBoundingClientRect(),x=(e.clientX-r.left)/Z,y=(e.clientY-r.top)/Z;
    if(S.tool==='text'){e.preventDefault();snap();const el=addEl(L,'text',x,y);setTool('select');const c=el.querySelector('.ct');c.focus();getSelection().selectAllChildren(c)}
    else if(S.tool==='box'){e.preventDefault();snap();addEl(L,'box',x,y,{w:140,h:30});setTool('select')}
    else if(S.tool==='cut'||S.tool==='area'){e.preventDefault();startCut(d,L,x,y)}
    else if(S.tool==='line'){e.preventDefault();startLine(d,L,x,y)}
    else if(S.tool==='frame'){e.preventDefault();startFrame(d,L,x,y)}
    else if(t===L)select(null);
  });
  L.addEventListener('focusin',e=>{const t=e.target;if(t.classList.contains('tx')||t.classList.contains('ct'))snap();if(t.classList.contains('tx'))select(t);else if(t.classList.contains('ct'))select(t.closest('.el'))});
  L.addEventListener('input',e=>{if(e.target.classList.contains('tx'))markEd(e.target)});
  return d;
}

function addEl(L,type,x,y,o={}){
  const e=document.createElement('div');e.className='el '+type;e.dataset.t=type;e.style.left=x+'px';e.style.top=y+'px';
  if(type==='text'){e.innerHTML='<i class="mv" title="Move">&#10021;</i><div class="ct" contenteditable spellcheck="false">New text</div>';e.style.fontSize='18px';e.style.color='#000000'}
  else{
    e.style.width=o.w+'px';e.style.height=o.h+'px';
    if(type==='box')e.style.background='#ffffff';
    if(type==='img'){
      e.innerHTML='<img class="ghost" draggable="false"><div class="win"><img draggable="false"></div>';
      e.dataset.k=regImg(o.src);e.querySelectorAll('img').forEach(m=>m.src=o.src);
      e._i={iw:o.w,ih:o.h,ox:0,oy:0};applyImg(e);
      e.insertAdjacentHTML('beforeend',['tl','tr','bl','br','l','r','t','b'].map(k=>'<i class="ch" data-s="'+k+'"></i>').join(''));
    }
    e.insertAdjacentHTML('beforeend','<i class="rz" title="Resize"></i>');
  }
  L.appendChild(e);bindEl(e);select(e);return e;
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function applyImg(e){const i=e._i;e.querySelectorAll('img').forEach(m=>{m.style.width=i.iw+'px';m.style.height=i.ih+'px';m.style.left=-i.ox+'px';m.style.top=-i.oy+'px'})}
function scaleImg(e,f){
  if(!(f>0))return;const i=e._i;
  ['iw','ih','ox','oy'].forEach(k=>i[k]*=f);
  e.style.width=(parseFloat(e.style.width)*f)+'px';e.style.height=(parseFloat(e.style.height)*f)+'px';applyImg(e);sync();
}
function bindEl(e){
  e.addEventListener('pointerdown',ev=>{
    select(e);
    const t=ev.target,isImg=e.dataset.t==='img';let mode=null;
    if(t.classList.contains('ch'))mode='crop';
    else if(t.classList.contains('rz'))mode='rz';
    else if(isImg&&e.classList.contains('crop'))mode='pan';
    else if(t.classList.contains('mv')||e.dataset.t!=='text')mode='mv';
    if(!mode)return;
    snap();ev.preventDefault();e.setPointerCapture(ev.pointerId);
    const sx=ev.clientX,sy=ev.clientY,ox=parseFloat(e.style.left)||0,oy=parseFloat(e.style.top)||0;
    const ow=parseFloat(e.style.width)||e.offsetWidth,oh=parseFloat(e.style.height)||e.offsetHeight,i0=isImg?{...e._i}:null,sd=t.dataset.s||'';
    const mv=m=>{
      const dx=(m.clientX-sx)/Z,dy=(m.clientY-sy)/Z;
      if(mode==='mv'){e.style.left=ox+dx+'px';e.style.top=oy+dy+'px'}
      else if(mode==='rz'){
        const ln=e.classList.contains('line'),w=Math.max(isImg?20:ln?1:10,ow+dx);
        if(isImg){const f=w/ow;Object.assign(e._i,{iw:i0.iw*f,ih:i0.ih*f,ox:i0.ox*f,oy:i0.oy*f});e.style.width=w+'px';e.style.height=oh*f+'px';applyImg(e)}
        else{e.style.width=w+'px';e.style.height=Math.max(ln?1:10,oh+dy)+'px'}
      }
      else if(mode==='pan'){e._i.ox=clamp(i0.ox-dx,0,i0.iw-ow);e._i.oy=clamp(i0.oy-dy,0,i0.ih-oh);applyImg(e)}
      else{
        let L=0,T=0,W=ow,H=oh,cx=i0.ox,cy=i0.oy,d;
        if(sd.includes('l')){d=clamp(dx,-i0.ox,ow-20);L=d;W=ow-d;cx=i0.ox+d}
        if(sd.includes('r')){d=clamp(dx,-(ow-20),i0.iw-i0.ox-ow);W=ow+d}
        if(sd.includes('t')){d=clamp(dy,-i0.oy,oh-20);T=d;H=oh-d;cy=i0.oy+d}

const rk=e=>(e.classList.contains('box')&&!e.classList.contains('line')&&!e.classList.contains('frame'))?0:e.classList.contains('img')?2:1;
function mkFrame(L,x,y,w,h){const e=addEl(L,'box',x,y,{w,h});e.classList.add('frame');e.style.background='transparent';e.style.border=thick()+'px solid #000000';

async function takeArea(move){
  const c=S.cut;if(!c)return;const d=c.d,a={x0:c.x0,y0:c.y0,x1:c.x1,y1:c.y1},cv=d.querySelector('canvas');

function snapState(){return allPages().map(d=>{const L=d.querySelector('.layer');L.querySelectorAll('.el.img').forEach(e=>{if(e._i)e.dataset.i=JSON.stringify(e._i)});const cl=L.cloneNode(true);cl.querySelectorAll('.el.img img').forEach(m=>m.removeAttribute('src'));return{d,h:cl.innerHTML,c:JSON.stringify(d._cuts)}})}
const keyOf=s=>s.map(r=>r.d.dataset.id+'|'+r.h.replace(/ (sel|crop)(?=[" ])/g,'')+'|'+r.c).join('§');
function snap(){const s=snapState(),k=keyOf(s),t=U[U.length-1];if(t&&t.k===k)return;s.k=k;U.push(s);if(U.length>25)U.shift();upd()}
function upd(){$('un').disabled=!U.length}
function restore(s){
  cancelCut();select(null);$('pages').replaceChildren(...s.map(r=>r.d));
  s.forEach(r=>{const d=r.d,L=d.querySelector('.layer');L.innerHTML=r.h;
    L.querySelectorAll('.el').forEach(e=>{e.classList.remove('sel','crop');bindEl(e);if(e.dataset.i)e._i=JSON.parse(e.dataset.i);if(e.dataset.k)e.querySelectorAll('img').forEach(m=>m.src=IR[e.dataset.k])});
    if(JSON.stringify(d._cuts)!==r.c){d._cuts=JSON.parse(r.c);if(d._on){unpaint(d);paint(d)}}});
  sync();
}
function undo(){const cur=keyOf(snapState());let s;while((s=U.pop())&&s.k===cur);if(s)restore(s);upd()}

/* ===== delete row / column and close the gap ===== */
function startCut(d,L,x0,y0){
  const rb=document.createElement('div');rb.className='rb';L.appendChild(rb);
  const r0=L.getBoundingClientRect(),bw=+d.dataset.bw,bh=+d.dataset.bh;let X=x0,Y=y0;
  const mv=m=>{X=clamp((m.clientX-r0.left)/Z,0,bw);Y=clamp((m.clientY-r0.top)/Z,0,bh);
    Object.assign(rb.style,{left:Math.min(x0,X)+'px',top:Math.min(y0,Y)+'px',width:Math.abs(X-x0)+'px',height:Math.abs(Y-y0)+'px'})};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);rb.remove();
    const c={x0:Math.min(x0,X),x1:Math.max(x0,X),y0:Math.min(y0,Y),y1:Math.max(y0,Y)};
    if(c.x1-c.x0<6||c.y1-c.y0<6){if(S.tool==='area'){c.x0=Math.max(0,x0-90);c.x1=Math.min(bw,x0+90);c.y0=Math.max(0,y0-20);c.y1=Math.min(bh,y0+20)}else{c.x0=bw*.04;c.x1=bw*.96;c.y0=Math.max(0,y0-12);c.y1=Math.min(bh,y0+12)}c.dir='row'}
    else c.dir=(c.x1-c.x0>=c.y1-c.y0)?'row':'col';
    showCut(d,c)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
}
function cancelCut(){if(S.cut){S.cut.el.remove();S.cut=null}$('cb').style.display='none'}
function showCut(d,c){
  cancelCut();const el=document.createElement('div');el.className='cs';
  el.innerHTML=['tl','tr','bl','br','l','r','t','b'].map(k=>'<i data-s="'+k+'"></i>').join('');
  d.firstChild.appendChild(el);S.cut={d,el,mode:S.tool,...c};drawCut();$('cb').style.display='flex';
  el.addEventListener('pointerdown',ev=>{
    ev.preventDefault();ev.stopPropagation();
    const c=S.cut,sd=ev.target.dataset.s||'',o={...c},sx=ev.clientX,sy=ev.clientY,bw=+c.d.dataset.bw,bh=+c.d.dataset.bh;
    const mv=m=>{const dx=(m.clientX-sx)/Z,dy=(m.clientY-sy)/Z;
      if(!sd){const w=o.x1-o.x0,h=o.y1-o.y0;c.x0=clamp(o.x0+dx,0,bw-w);c.y0=clamp(o.y0+dy,0,bh-h);c.x1=c.x0+w;c.y1=c.y0+h}
      else{if(sd.includes('l'))c.x0=clamp(o.x0+dx,0,o.x1-6);if(sd.includes('r'))c.x1=clamp(o.x1+dx,o.x0+6,bw);if(sd.includes('t'))c.y0=clamp(o.y0+dy,0,o.y1-6);if(sd.includes('b'))c.y1=clamp(o.y1+dy,o.y0+6,bh)}
      drawCut()};
    const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  });
}
function drawCut(){
  const c=S.cut;if(!c)return;
  Object.assign(c.el.style,{left:c.x0+'px',top:c.y0+'px',width:c.x1-c.x0+'px',height:c.y1-c.y0+'px'});
  c.el.style.setProperty('--hs',22/Z+'px');
  const ar=c.mode==='area';$('c-move').style.display=AD===0?'':'none';$('c-copy').textContent=AD===0?'Copy':'Copy to Main PDF';$('cb-cut').style.display=ar?'none':'contents';$('cb-area').style.display=ar?'inline-flex':'none';
  $('cd-row').classList.toggle('on',c.dir==='row');$('cd-col').classList.toggle('on',c.dir==='col');
  $('ci').textContent=ar?'Handles se area set karo. Copy = original rahega, Cut = original ki jagah white':c.dir==='row'?'Row delete: neeche ki rows upar aayengi':'Column delete: right ke columns left aayenge';
}
$('cd-row').onclick=()=>{if(S.cut){S.cut.dir='row';drawCut()}};
$('cd-col').onclick=()=>{if(S.cut){S.cut.dir='col';drawCut()}};
$('c-no').onclick=()=>setTool('select');
$('c-ok').onclick=()=>{const c=S.cut;if(!c)return;const d=c.d,k={x0:c.x0,y0:c.y0,x1:c.x1,y1:c.y1,dir:c.dir};setTool('select');applyCut(d,k)};
function applyCut(d,c){
  snap();d._cuts.push(c);
  const h=c.y1-c.y0,w=c.x1-c.x0;
  [...d.querySelector('.layer').children].forEach(e=>{
    if(!e.classList.contains('tx')&&!e.classList.contains('el'))return;
    const l=e.offsetLeft,t=e.offsetTop,cx=l+e.offsetWidth/2,cy=t+e.offsetHeight/2;
    if(c.dir==='row'){if(cx<c.x0||cx>c.x1)return;if(cy>=c.y0&&cy<=c.y1)return e.remove();if(cy>c.y1)e.style.top=t-h+'px'}
    else{if(cy<c.y0||cy>c.y1)return;if(cx>=c.x0&&cx<=c.x1)return e.remove();if(cx>c.x1)e.style.left=l-w+'px'}
  });
  if(d._on){unpaint(d);paint(d)}
  select(null);
}
function cutCanvas(d,c,k){
  const x=c.getContext('2d'),f=c.width/+d.dataset.bw,X0=Math.round(k.x0*f),X1=Math.round(k.x1*f),Y0=Math.round(k.y0*f),Y1=Math.round(k.y1*f);
  x.fillStyle='#fff';
  if(k.dir==='row'){const w=X1-X0,h=Y1-Y0;x.drawImage(c,X0,Y1,w,c.height-Y1,X0,Y0,w,c.height-Y1);x.fillRect(X0,c.height-h,w,h)}
  else{const w=X1-X0,h=Y1-Y0;x.drawImage(c,X1,Y0,c.width-X1,h,X0,Y0,c.width-X1,h);x.fillRect(c.width-w,Y0,w,h)}
}
const spl=(a,b,c0,c1)=>[[a,Math.min(b,c0),0],[Math.max(a,c0),Math.min(b,c1),1],[Math.max(a,c1),b,2]].filter(q=>q[1]-q[0]>.01);
async function cutPdf(out,old,p){
  const cb=old.getCropBox(),bw=+p.dataset.bw,bh=+p.dataset.bh,k=cb.width/bw;
  let P=[{x0:0,y0:0,x1:bw,y1:bh,ox:0,oy:0}];
  p._cuts.forEach(c=>{
    const n=[],h=c.y1-c.y0,w=c.x1-c.x0;
    P.forEach(r=>{
      if(c.dir==='row')spl(r.x0,r.x1,c.x0,c.x1).forEach(A=>{
        if(A[2]!==1)return n.push({...r,x0:A[0],x1:A[1]});
        spl(r.y0,r.y1,c.y0,c.y1).forEach(B=>{if(B[2]===1)return;const s=B[2]===2?h:0;n.push({x0:A[0],x1:A[1],y0:B[0]-s,y1:B[1]-s,ox:r.ox,oy:r.oy-s})});
      });
      else spl(r.y0,r.y1,c.y0,c.y1).forEach(A=>{
        if(A[2]!==1)return n.push({...r,y0:A[0],y1:A[1]});
        spl(r.x0,r.x1,c.x0,c.x1).forEach(B=>{if(B[2]===1)return;const s=B[2]===2?w:0;n.push({x0:B[0]-s,x1:B[1]-s,y0:A[0],y1:A[1],ox:r.ox-s,oy:r.oy})});
      });
    });
    P=n;
  });
  const np=out.addPage([cb.width,cb.height]);
  for(const r of P){
    const bb={left:cb.x+(r.x0-r.ox)*k,right:cb.x+(r.x1-r.ox)*k,bottom:cb.y+cb.height-(r.y1-r.oy)*k,top:cb.y+cb.height-(r.y0-r.oy)*k};
    np.drawPage(await out.embedPage(old,bb),{x:r.x0*k,y:cb.height-r.y1*k});
  }
  out.removePage(out.getPageCount()-2);
  return np;
}
async function runExport(b,label,mode){
  if(docs.length&&AD!==0)switchDoc(0);
  const ps=allPages();if(!ps.length)return alert('Open a PDF first.');
  b.textContent='Preparing...';b.disabled=true;
  await new Promise(r=>setTimeout(r,30));
  try{
    const{PDFDocument,StandardFonts,rgb}=PDFLib;
    const out=await PDFDocument.create();
    const src=S.bytes?await PDFDocument.load(S.bytes,{ignoreEncryption:true}):null;
    const reg=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold);
    const idxs=ps.map(p=>+p.dataset.src).filter(i=>i>=0);
    const copied=src&&idxs.length?await out.copyPages(src,idxs):[];
    let ci=0;
    for(const p of ps){
      let pg=+p.dataset.src>=0?out.addPage(copied[ci++]):out.addPage([+p.dataset.pw,+p.dataset.ph]);
      let gone=new Set;
      const txs=[...p.querySelector('.layer').children].filter(e=>e.classList.contains('tx')&&e.classList.contains('ed')&&e.dataset.it);
      if(+p.dataset.src>=0&&txs.length){try{gone=scrubPage(out,pg,txs)}catch(err){console.warn('scrub failed',err)}}
      if(p._cuts.length&&+p.dataset.src>=0)pg=await cutPdf(out,pg,p);
      const cb=pg.getCropBox(),k=cb.width/+p.dataset.bw,X=v=>cb.x+v*k,Y=v=>cb.y+cb.height-v*k;
      for(const e of [...p.querySelector('.layer').children].sort((a,b)=>rk(a)-rk(b))){
        const bx=e.classList.contains('box'),l=bx?parseFloat(e.style.left):e.offsetLeft,t=bx?parseFloat(e.style.top):e.offsetTop,w=bx?parseFloat(e.style.width):e.offsetWidth,h=bx?parseFloat(e.style.height):e.offsetHeight;
        if(bx&&e.classList.contains('frame')){
          const T=parseFloat(e.style.borderTopWidth)||1,c=col(getComputedStyle(e).borderTopColor);
          [[l,t,w,T],[l,t+h-T,w,T],[l,t,T,h],[l+w-T,t,T,h]].forEach(r=>pg.drawRectangle({x:X(r[0]),y:Y(r[1]+r[3]),width:r[2]*k,height:r[3]*k,color:c}));continue;
        }
        if(bx){
          pg.drawRectangle({x:X(l),y:Y(t+h),width:w*k,height:h*k,color:col(getComputedStyle(e).backgroundColor)});continue;
        }
        if(e.classList.contains('img')){
          const ig=e.querySelector('.win img'),I=e._i;let u=ig.src,im;
          if(u.startsWith('data:image/jpeg'))im=await out.embedJpg(u);
          else{
            if(!u.startsWith('data:image/png')){const c=document.createElement('canvas');c.width=ig.naturalWidth;c.height=ig.naturalHeight;c.getContext('2d').drawImage(ig,0,0);u=c.toDataURL('image/png')}
            im=await out.embedPng(u);
          }
          const full=I.ox<.5&&I.oy<.5&&Math.abs(I.iw-w)<1&&Math.abs(I.ih-h)<1;
          if(full)pg.drawImage(im,{x:X(l),y:Y(t+h),width:w*k,height:h*k});
          else if(PDFLib.clip&&PDFLib.rectangle&&PDFLib.pushGraphicsState){
            pg.pushOperators(PDFLib.pushGraphicsState(),PDFLib.rectangle(X(l),Y(t+h),w*k,h*k),PDFLib.clip(),PDFLib.endPath());
            pg.drawImage(im,{x:X(l-I.ox),y:Y(t-I.oy+I.ih),width:I.iw*k,height:I.ih*k});
            pg.pushOperators(PDFLib.popGraphicsState());
          }else{
            const nw=ig.naturalWidth,nh=ig.naturalHeight,c=document.createElement('canvas');
            c.width=Math.round(w/I.iw*nw);c.height=Math.round(h/I.ih*nh);
            c.getContext('2d').drawImage(ig,I.ox/I.iw*nw,I.oy/I.ih*nh,c.width,c.height,0,0,c.width,c.height);
            pg.drawImage(await out.embedPng(c.toDataURL('image/png')),{x:X(l),y:Y(t+h),width:w*k,height:h*k});
          }
          continue;
        }
        const isTx=e.classList.contains('tx');
        if(isTx&&!e.classList.contains('ed'))continue;
        const n=isTx?e:e.querySelector('.ct'),cs=getComputedStyle(n);
        if(isTx&&!gone.has(e))pg.drawRectangle({x:X(l-1),y:Y(t+h+1),width:(w+2)*k,height:(h+2)*k,color:col(getComputedStyle(e).backgroundColor)});
        const fs=parseFloat(cs.fontSize),isB=+cs.fontWeight>=600,ox=isTx?1:4,oy=isTx?0:2;
        const lines=n.innerText.replace(/\n$/,'').split('\n'),top=t+oy;
        if(/^[\x20-\x7E\xA0-\xFF]*$/.test(lines.join(''))){
          lines.forEach((ln,i)=>pg.drawText(ln,{x:X(l+ox),y:Y(top+fs*.9465+i*fs*1.2),size:fs*k,font:isB?bold:reg,color:col(cs.color)}));
        }else{
          const r=textPng(lines,fs,isB,cs.color),im=await out.embedPng(r.url);
          pg.drawImage(im,{x:X(l+ox),y:Y(top+r.h),width:r.w*k,height:r.h*k});
        }
      }
    }
    const bytes=await out.save();
    if(mode==='zip')await saveZip(bytes);else saveBlob(new Blob([bytes],{type:'application/pdf'}),'edited.pdf');
  }catch(err){alert('Download failed: '+err.message)}
  b.textContent=label;b.disabled=false;
}
$('dl').onclick=()=>runExport($('dl'),'Download PDF','pdf');
$('dz').onclick=()=>runExport($('dz'),'Download CDR ZIP','zip');
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}
async function saveZip(bytes){
  if(!window.JSZip)throw new Error('ZIP library load nahi hui, internet check karo');
  const z=new JSZip(),imgs=z.folder('pages');z.file('edited.pdf',bytes);
  const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i),vp=pg.getViewport({scale:300/72}),c=document.createElement('canvas');
    c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    imgs.file('page-'+String(i).padStart(3,'0')+'.png',await new Promise(r=>c.toBlob(r,'image/png')));
    c.width=c.height=0;
  }
  z.file('README.txt','CorelDRAW me kholne ke liye:\n1. CorelDRAW > File > Open > edited.pdf (text/vector editable rehta hai)\n2. File > Save As > .cdr\n\npages/ folder me har page ki 300 DPI PNG image hai (trace/reference ke liye).\n');
  saveBlob(await z.generateAsync({type:'blob',compression:'DEFLATE'}),'edited-for-CorelDRAW.zip');
}
